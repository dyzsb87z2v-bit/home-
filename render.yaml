# Render Blueprint (https://render.com/docs/blueprint-spec) — creates paid resources only after you confirm in Render.
databases:
  - name: brh-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: brh-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: brh-db, property: connectionString }
      - key: APP_ENV
        value: production
      - { key: APP_URL, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: APP_ENCRYPTION_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: NEXT_PUBLIC_VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false }

  - type: worker
    name: brh-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: brh-db, property: connectionString }
      - key: APP_ENV
        value: production
      - { key: APP_URL, sync: false }
      - { key: APP_ENCRYPTION_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: NEXT_PUBLIC_VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false }
