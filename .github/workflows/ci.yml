name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: brh, POSTGRES_PASSWORD: brh, POSTGRES_DB: brh_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brh" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://brh:brh@localhost:5432/brh_test
      DATABASE_URL: postgres://brh:brh@localhost:5432/brh_test
      SESSION_SECRET: ci-session-secret-ci-session-secret-1234
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
